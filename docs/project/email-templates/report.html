<!-- EmailJS template: "Email this report" (scout_report). Paste into the template's HTML/code editor.
     Subject: {{subject}}
     To Email: {{to_email}}
     Params: to_email, to_name, subject, from_name, report_html (pre-built, email-safe HTML; triple braces keep it unescaped), app_url -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#EEF2F6;padding:32px 12px;font-family:Segoe UI,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="640" cellpadding="0" cellspacing="0" border="0" style="max-width:640px;width:100%;background:#FFFFFF;border:1px solid #D5DDE7;border-radius:12px;overflow:hidden;">
        <tr>
          <td style="background:#0B5CAD;padding:24px 32px;">
            <img src="https://d3ucnz03j0sngl.cloudfront.net/brand/acme-scout-email.png" width="180" height="40" alt="ACME Scout" style="display:block;border:0;height:40px;width:180px;">
          </td>
        </tr>
        <tr>
          <td style="padding:32px 32px 8px;color:#111C27;font-size:15px;line-height:1.6;">
            <p style="margin:0 0 4px;font-size:20px;font-weight:600;">Hi {{to_name}},</p>
            <p style="margin:0;color:#3F4D5D;">Here's the latest delivery report from ACME Scout.</p>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 32px 8px;color:#111C27;font-size:14px;line-height:1.5;">
            {{{report_html}}}
          </td>
        </tr>
        <tr>
          <td style="padding:16px 32px 32px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="background:#0B5CAD;border-radius:8px;">
                  <a href="{{app_url}}" style="display:inline-block;padding:12px 24px;color:#FFFFFF;font-weight:600;text-decoration:none;font-size:15px;">Open the live dashboard</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 32px;border-top:1px solid #E1E7EE;color:#6B7A8C;font-size:12px;">
            Sent from ACME Scout by {{from_name}}. Figures are live as of the time this email was sent.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
